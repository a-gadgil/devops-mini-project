stages:
  - test
  - security

# 1. TEST STAGE: Differential Python Linting
lint_python_code:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y git
    - pip install --cache-dir .cache/pip flake8
  script:
    - echo "Fetching target branch for diff comparison..."
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    
    - echo "Identifying modified Python files..."
    - CHANGED_FILES=$(git diff --name-only origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME -- '*.py')
    
    - |
      if [ -n "$CHANGED_FILES" ]; then
          echo "Linting the following modified files:"
          echo "$CHANGED_FILES"
          flake8 $CHANGED_FILES
      else
          echo "No Python files were modified in this Merge Request. Skipping linter."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# 2. SECURITY STAGE: Secret Scanning
scan_secrets:
  stage: security
  image: 
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'